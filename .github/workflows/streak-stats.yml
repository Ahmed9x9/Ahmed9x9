name: Update streak card

on:
  schedule:
    - cron: "17 3 * * *" # Daily at 06:17 in Saudi Arabia.
  push:
    branches: [main]
    paths:
      - .github/workflows/streak-stats.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-streak-card
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@9202e37665889fdb42d9a7df8501c1800acf761d
        with:
          options: user=Ahmed9x9&theme=dark&hide_border=false&disable_animations=true&timezone=Asia/Riyadh
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated image
        shell: python
        run: |
          from pathlib import Path
          from xml.etree import ElementTree as ET

          card = Path("profile/streak.svg")
          root = ET.fromstring(card.read_bytes())
          assert root.tag == "{http://www.w3.org/2000/svg}svg"
          text = " ".join(root.itertext())
          for label in ("Total Contributions", "Current Streak", "Longest Streak"):
              assert label in text, f"Missing streak data: {label}"
          normalized = "\n".join(line.rstrip() for line in card.read_text().splitlines())
          card.write_text(normalized + "\n", encoding="utf-8")

      - name: Save updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          if git diff --cached --quiet; then
            echo "Streak card is already up to date."
            exit 0
          fi
          git commit -m "chore: refresh GitHub streak card"
          git pull --rebase origin main
          git push origin HEAD:main
